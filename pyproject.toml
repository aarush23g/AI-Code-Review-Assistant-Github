[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '''
/(
  temp_test_clone
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["temp_test_clone"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
exclude = ["temp_test_clone"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = ["temp_test_clone"]